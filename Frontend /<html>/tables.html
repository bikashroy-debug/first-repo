<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables</title>
</head>
<body>
     <table border="1" >
        <caption>Food menu</caption>
          <thead>
            <tr>
                <th align="center">Item</th>
                <th align="center">Price</th>
            </tr>
          </thead>
         <tbody>
           <tr>
                <td align="center">Frooti</td>
                <td align="center">10</td> 
           </tr>
           <tr>
                <td align="center">samosha</td>
                <td align="center">20</td>
           </tr>
           <tr>
                <td align="center">chips</td>
                <td align="center">5</td>
           </tr>
         </tbody>
          
    </table>
    <table border="1">
        <caption>Food Menu</caption>
        <thead>
            <tr>
                <th rowspan="2">Item</th>
                <th colspan="2">Price</th>
            </tr>
            <tr>
                <th>INR</th>
                <th>USD</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Frooti</td>
                <td>10</td>
                <td>0.14</td>
            </tr>
            <tr>
                <td>Samosha</td>
                <td>12</td>
                <td>0.17</td>
            </tr>
            <tr>
                <td>Chips</td>
                <td>20</td>
                <td>0.28</td>
            </tr>
        </tbody>
    </table>
    <table border="1">
        <caption>A Test Table With Merge Cells</caption>
        <tbody>
            <tr>
                <td rowspan="2"></td>
                <td colspan="2">Averege</td>
                <td rowspan="2">Red Eyes</td>            
            </tr>
            <tr>
                <td>Height</td>
                <td>Weight</td>
            </tr>
            <tr>
                <td>Males</td>
                <td>1.9</td>
                <td>0.003</td>
                <td>40%</td>
            </tr>
            <tr>
                <td>Females</td>
                <td>1.7</td>
                <td>0.002</td>
                <td>43%</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
